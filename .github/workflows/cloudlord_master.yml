name: cloud-lord master
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: cloudlord-master
    steps:
      - name: Assume Role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: cicd
      - uses: actions/checkout@v3
        id: checkout
      - uses: actions/setup-node@v3
        with:
          node-version: 20.9.0
      #Upload the app on S3 bucket
      - name: Build React App and upload to S3
        id: build-project
        run: |
          npm install
          npm run build
          mv robots.txt dist/
          cd dist
          echo "google-site-verification: ${{ secrets.GOOGLE_VERIFICATION }}" > ${{ secrets.GOOGLE_VERIFICATION }}
          aws s3 sync assets/ s3://${{ secrets.BUCKET }}/assets --cache-control "public,max-age=31536000,immutable" --delete --exclude ".git/*" --exclude ".github/*" --exclude "README*"
          aws s3 sync . s3://${{ secrets.BUCKET }} --cache-control "public,max-age=300,must-revalidate" --delete --exclude "assets/*" --exclude ".git/*" --exclude ".github/*" --exclude "README*"
      - name: Invalidate CloudFront
        uses: chetan/invalidate-cloudfront-action@v2
        env:
          DISTRIBUTION: ${{ secrets.CLOUDLORD_DISTRIBUTION_ID }}
          PATHS: "/ /index.html /robots.txt /sitemap.xml /llms.txt /feed*"